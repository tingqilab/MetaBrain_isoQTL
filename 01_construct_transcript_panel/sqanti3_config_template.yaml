main:
  refGTF: '/qitinglab/sharedata/genome_annotation_reference/GENCODEv44/gencode.v44.annotation.gtf'
  refFasta: '/qitinglab/sharedata/genome_annotation_reference/GRCh38.primary_assembly.genome.fa'
  cpus: 24
  dir: ${dir}/qc_filter_rescue
  output: isoforms
qc:
  enabled: true
  options:
    isoforms: ''
    min_ref_len: 0
    force_id_ignore: false
    fasta: false
    genename: false
    short_reads: ''
    SR_bam: ''
    novel_gene_prefix: 'novel'
    aligner_choice: minimap2
    gmap_index: ''
    sense: false
    sites: ATAC,GCAG,GTAG
    skipORF: false
    orf_input: ''
    CAGE_peak: '/qitinglab/linfeng/software/sqanti3/data/ref_TSS_annotation/human.refTSS_v3.1.hg38.bed'
    polyA_motif_list: '/qitinglab/linfeng/software/sqanti3/data/polyA_motifs/mouse_and_human.polyA_motif.txt'
    polyA_peak: ''
    phyloP_bed: ''
    saturation: true
    report: both
    isoform_hits: false
    ratio_TSS_metric: max
    chunks: 1
    is_fusion: false
    expression: ''
    coverage: ''
    window: 20
    fl_count: ''
    isoAnnotLite: false
    gff3: ''
filter:
  enabled: true
  options:
    common:
      sqanti_class: ${dir}/qc_filter_rescue/isoforms_classification.txt  
      isoAnnotGFF3: ''
      filter_isoforms: ${dir}/qc_filter_rescue/isoforms_corrected.fasta  
      filter_gtf: ${dir}/qc_filter_rescue/isoforms_corrected.gtf  
      filter_sam: ''
      filter_faa: ${dir}/qc_filter_rescue/isoforms_corrected.faa
      filter_mono_exonic: true
      skip_report: false
    rules:
      enabled: true
      options:
        json_filter: /qitinglab/linfeng/SCLR_project/westlake_pbmc/02_Isoform_identification/scripts/sqanti3_yaml/filter_rules.json
    ml:
      enabled: false
      options:
        percent_training: 0.8
        TP: ''
        TN: ''
        threshold: 0.7
        force_fsm_in: false
        intermediate_files: false
        remove_columns: ''
        max_class_size: 3000
        intrapriming: 60
rescue:
  enabled: true
  options:
    common:
      filter_class: ${dir}/qc_filter_rescue/isoforms_RulesFilter_result_classification.txt
      rescue_isoforms: ${dir}/qc_filter_rescue/isoforms_corrected.fasta
      rescue_gtf: ${dir}/qc_filter_rescue/isoforms.filtered.gtf
      refClassif: ''
      rescue_mono_exonic: all
      mode: automatic
    rules:
      enabled: true
      options:
        json: ''
    ml:
      enabled: false
      options:
        randomforest: ''
        threshold: 0.7